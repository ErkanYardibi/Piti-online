function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
function cloudCustomerRow(c,ptId,userId=null){c.dbId=c.dbId||(/^[0-9a-f-]{36}$/i.test(String(c.id))?c.id:uuid());return {id:c.dbId,pt_id:ptId||null,user_id:userId,full_name:c.name,phone:c.phone||null,email:c.email||null,blood_type:c.blood||null,gender:c.gender||null,weight:Number(c.weight)||null,height:Number(c.height)||null,archived:!!c.archived,updated_at:new Date().toISOString()}}
function sessionStatusToDb(s){return s==='noshow'?'no_show':(['planned','completed','no_show','cancelled'].includes(s)?s:'planned')}
function sessionStatusFromDb(s){return s==='no_show'?'noshow':s}
function eventTimestamp(date,time){return new Date(`${date}T${/^\d\d:\d\d$/.test(time||'')?time:'00:00'}:00`).toISOString()}

 if(!authUser||demoMode||!db)return;

 const {error:profileError}=await db.from('profiles').upsert({id:authUser.id,role:state.role,full_name:profile.name||authUser.email,phone:profile.phone||null,avatar_url:null},{onConflict:'id'});

 if(rows.length){const {error}=await db.from('clients').upsert(rows,{onConflict:'id'});if(error)return console.error('Müşteri senkronizasyonu:',error.message)}
 const byLocal=new Map(customers.map(c=>[String(c.id),c]));
 const sessions=(state.events||[]).filter(e=>e.type==='session'&&byLocal.has(String(e.customerId))).map(e=>{const c=byLocal.get(String(e.customerId));e.dbId=e.dbId||uuid();return {id:e.dbId,client_id:c.dbId,pt_id:state.role==='pt'?authUser.id:(e.ptId||c.ptId||null),starts_at:eventTimestamp(e.date,e.time),ends_at:e.endTime?eventTimestamp(e.date,e.endTime):null,status:sessionStatusToDb(e.status),workout_title:e.title||null,muscle_groups:Array.isArray(e.muscleGroups)?e.muscleGroups:[],salon:e.location||null,notes:e.note||e.sessionNote||null,counts_against_package:e.counts!==false,updated_at:new Date().toISOString()}});
 if(sessions.length){const {error}=await db.from('sessions').upsert(sessions,{onConflict:'id'});if(error)console.error('Seans senkronizasyonu:',error.message)}
}
function mapCloudCustomer(c){return {id:c.id,dbId:c.id,name:c.full_name,initials:(c.full_name||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),phone:c.phone||'',email:c.email||'',blood:c.blood_type||'',gender:c.gender||'',weight:Number(c.weight)||'',height:Number(c.height)||'',archived:!!c.archived,status:'active',appAccess:c.user_id?'registered':'manual',userId:c.user_id,ptId:c.pt_id,cloudManaged:true}}

 localStorage.removeItem('pitiPendingProfile');state.role=profile.role==='member'?'member':'pt';state.page=state.role==='pt'?'dashboard':'today';
 if(state.role==='pt'){state.ptProfile.name=profile.full_name;const {data:clients,error}=await db.from('clients').select('*').eq('pt_id',authUser.id).order('created_at');if(error)throw error;if(clients?.length){const mapped=clients.map(mapCloudCustomer);state.customer=mapped[0];state.manualCustomers=mapped.slice(1);state.demoCustomers=[]}}
 else {let {data:client,error}=await db.from('clients').select('*').eq('user_id',authUser.id).maybeSingle();if(error)throw error;if(!client){const created=await db.from('clients').insert({user_id:authUser.id,full_name:profile.full_name,email:authUser.email}).select().single();if(created.error)throw created.error;client=created.data}state.customer=mapCloudCustomer(client)}

 state.events=(state.events||[]).filter(e=>!e.cloudManaged).concat(remoteEvents);localStorage.setItem('pitiDemoV4',JSON.stringify(state));render();

function packageEnd(pkg){return pkg?.expireDate||pkg?.end||''}
function packageEndLabel(pkg=state.package){const end=packageEnd(pkg);return end?new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric'}).format(new Date(end+'T12:00:00')):'—'}
function daysLeft(pkg=state.package){const end=packageEnd(pkg);if(!end)return 0; const e=new Date(end+'T00:00:00'); const t=new Date();t.setHours(0,0,0,0); return Math.max(0,Math.ceil((e-t)/86400000)); }
function sessionsLeft(pkg=state.package){if(!pkg)return 0;return Math.max(0,pkg.totalSessions-pkg.usedSessions)}
function packageEnded(){return daysLeft()<=0 || sessionsLeft()<=0}

function isMemberEvent(e){return e.type==='session'&&(e.customerId==null||String(e.customerId)===String(state.customer.id));}
function eventStart(e){return new Date(e.date+'T'+(/^\d{2}:\d{2}$/.test(e.time)?e.time:'00:00')+':00').getTime();}
function eventFinish(e){const start=eventStart(e);if(e.time==='Tüm gün')return new Date(e.date+'T23:59:59').getTime();if(e.endTime){let end=new Date(e.date+'T'+e.endTime+':00').getTime();if(end<=start)end+=86400000;return end;}return start+60*60000;}
function activeEvent(e,now=Date.now()){return !['completed','noshow','cancelled','canceled','rejected'].includes(e.status)&&eventFinish(e)>now;}
function hasDelay(e){return e.type==='session'&&Number(e.delay?.minutes)>0&&activeEvent(e);}
function eventCustomer(e){return e.customerName||(isMemberEvent(e)?state.customer.name:'');}
function arrivalTime(e){return new Date(eventStart(e)+Number(e.delay.minutes)*60000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});}
function delayBadge(e){return hasDelay(e)?`<span class="lateBadge">◷ ${Number(e.delay.minutes)} dk gecikecek · Tahmini varış ${arrivalTime(e)}</span>`:'';}

function recordSessionResult(e,status,count,reason='',note='',groups){
 if(leaveConflicts(e).length){toast('Önce izin çakışmasını iptal veya erteleme ile çöz.');return false;}
 if(state.role!=='pt'||!e||e.type!=='session'||!['planned','completed','noshow'].includes(e.status)||!['completed','noshow'].includes(status))return false;
 if(eventFinish(e)>Date.now()){toast('Gelecekteki veya devam eden seans henüz sonuçlandırılamaz.');return false;}
 const account=e.customerId==null||String(e.customerId)===String(state.customer.id)?state:(state.customerAccounts||{})[e.customerId];
 count=status==='completed'||!!count;
 const previous={status:e.status,counts:e.counts,reason:e.noShowReason||'',note:e.noShowNote||''};
 const before=e.packageDebit??(account?.package&&(e.status==='completed'||e.status==='noshow'&&e.counts)?1:0);
 const after=count&&account?.package?1:0;
 if(previous.status===status&&!!previous.counts===count&&previous.reason===reason&&previous.note===note)return false;
 e.status=status;e.counts=count;e.muscleGroups=Array.isArray(groups)?groups:(Array.isArray(e.muscleGroups)?e.muscleGroups:[]);e.resolvedAt=new Date().toISOString();e.resolvedBy='pt';
 if(status==='noshow'){e.noShowReason=reason;e.noShowNote=note;}
 else{delete e.noShowReason;delete e.noShowNote;}
 if(account?.package)account.package.usedSessions=Math.max(0,account.package.usedSessions+after-before);
 e.packageDebit=after;
 const hours=Number(state.ptProfile.confirmHours)||24;
 e.confirmation={status:'pending',createdAt:e.resolvedAt,deadline:new Date(Date.now()+hours*3600000).toISOString()};
 const audit={at:e.resolvedAt,by:'pt',previous,next:{status,counts:count,reason,note},confirmation:e.confirmation};
 (e.resultHistory||(e.resultHistory=[])).push(audit);
 const label=s=>s==='completed'?'Tamamlandı':s==='noshow'?'No Show':'Planlı';
 if(account){account.financeHistory=account.financeHistory||[];account.financeHistory.push({date:iso(new Date()),text:'Seans sonucu güncellendi',detail:`${e.date} · ${e.title} · ${label(previous.status)} → ${label(status)} · ${count?'Seans sayıldı':'Seans sayılmadı'} · ${new Date(e.resolvedAt).toLocaleString('tr-TR')}`,eventId:e.id,...audit});}
 save();return true;
}

 const respond=(id,status)=>{const e=state.events.find(x=>x.id===id);if(state.role!=='member'||!e||e.customerId!=null&&String(e.customerId)!==String(state.customer.id)||e.confirmation.status!=='pending')return;if(Date.now()>=Date.parse(e.confirmation.deadline)){render();return;}e.confirmation.status=status;e.confirmation.respondedAt=new Date().toISOString();save();render();toast(status==='accepted'?'Seans sonucu onaylandı.':'İtirazın PT incelemesine alındı.');};

function leaveConflicts(e){
 if(!e||!['session','demo'].includes(e.type)||!['planned','requested'].includes(e.status))return [];
 return state.events.filter(l=>['off','memberoff'].includes(l.type)&&l.status!=='cancelled'&&(l.type==='off'||String(l.customerId??state.testPrimaryId??state.customer.id)===String(e.customerId??state.testPrimaryId??state.customer.id))&&eventStart(l)<eventFinish(e)&&eventFinish(l)>eventStart(e));
}
function leaveAudit(e,previous,action){
 const at=new Date().toISOString(),hours=Number(state.ptProfile.confirmHours)||24;
 e.confirmation={status:'pending',createdAt:at,deadline:new Date(Date.now()+hours*3600000).toISOString()};
 const entry={at,by:'pt',previous,next:{status:e.status,date:e.date,time:e.time,counts:!!e.counts},action,confirmation:e.confirmation};
 (e.resultHistory||(e.resultHistory=[])).push(entry);
 const account=String(e.customerId??state.testPrimaryId)===String(state.customer.id)?state:state.customerAccounts?.[e.customerId];
 if(account){(account.financeHistory||(account.financeHistory=[])).push({date:iso(new Date()),text:action,detail:eventCustomer(e)+' · '+previous.date+' '+previous.time+' → '+e.date+' '+e.time+' · '+(e.counts?'Seans sayıldı':'Seans düşülmedi'),...entry});}
}
function cancelLeaveSession(e,late=false,count=false){
 if(state.role!=='pt'||!leaveConflicts(e).length)return false;
 const ptLeave=leaveConflicts(e).some(l=>l.type==='off');
 const previous={status:e.status,date:e.date,time:e.time,counts:!!e.counts};
 const account=String(e.customerId??state.testPrimaryId)===String(state.customer.id)?state:state.customerAccounts?.[e.customerId];
 e.status='cancelled';e.lateCancellation=!ptLeave&&late;e.counts=e.type==='session'&&e.lateCancellation&&count;
 if(e.counts&&account?.package)account.package.usedSessions++;
 e.packageDebit=e.counts&&account?.package?1:0;
 delete e.delay;leaveAudit(e,previous,e.lateCancellation?'Geç iptal':'İzin nedeniyle iptal');return true;
}
function openLeaveDecision(id){
 const e=state.events.find(x=>x.id===id);if(state.role!=='pt'||!e||!leaveConflicts(e).length)return;

 openModal(`<h3>İzinle çakışan seans</h3><p>${escapeHtml(eventCustomer(e))} · ${formatShort(e.date)} · ${escapeHtml(e.time)}</p><div class="field"><label>İşlem</label><select id="leaveAction"><option value="cancel">İptal et</option><option value="move">Başka tarihe ertele</option></select></div><div id="moveFields" hidden><div class="field"><label>Yeni tarih</label><input class="input" type="date" id="moveDate" value="${e.date}"></div><div class="field"><label>Yeni başlangıç saati</label><input class="input" type="time" id="moveTime" value="${e.time}"></div></div><div id="cancelFields">${ptLeave?'<p>PT izni: paketten seans düşülmez.</p>':'<div class="field"><label><input type="checkbox" id="lateCancel"> Son dakika müşteri iptali (Geç iptal)</label></div><div class="field"><label><input type="checkbox" id="chargeCancel"> Geç iptalde seans paketten düşsün</label></div>'}</div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="saveLeaveDecision">Kaydet ve Müşteriye Bildir</button></div>`);
 modal.querySelector('#leaveAction').onchange=e=>{modal.querySelector('#moveFields').hidden=e.target.value!=='move';modal.querySelector('#cancelFields').hidden=e.target.value==='move';};
 modal.querySelector('#saveLeaveDecision').onclick=()=>{
 if(!leaveConflicts(e).length){closeModal();render();return;}
 if(modal.querySelector('#leaveAction').value==='move'){

 if(!date||!time)return toast('Yeni tarih ve saati seç.');

function isPTOffEntry(e){return !!e&&e.customerId==null&&e.type!=='memberoff'&&(['off','closed','excused'].includes(e.type)||e.status==='off'||e.title==='Çalışmıyor');}
function repairDuplicatePTOffEntries(){
 const seen=new Set(),before=JSON.stringify(state.events);
 const normalized=[];
 state.events.forEach(e=>{
  if(!isPTOffEntry(e)){normalized.push(e);return;}
  e.type='off';e.status='off';if(!e.title||e.title==='closed')e.title='Çalışmıyor';
  if(seen.has(e.date))return;
  seen.add(e.date);normalized.push(e);
 });
 state.events=normalized;
 if(JSON.stringify(state.events)!==before)save();
}
function repairDuplicateTestSessions(){
 if(state.duplicateTestSessionsVersion)return;
 const generated=state.events.filter(e=>Number(e.id)>=800000&&Number(e.id)<800036&&['session','demo'].includes(e.type)&&['planned','requested'].includes(e.status)).sort((a,b)=>Number(a.id)-Number(b.id));
 const used=new Set();
 generated.forEach(e=>{
  let key=e.date+'|'+e.time;
  if(!used.has(key)){used.add(key);return;}
  let slot=1,date,time;
  do{const d=addDays(new Date(today),slot+1);date=iso(d);time=String(9+(slot%4)*2).padStart(2,'0')+':00';key=date+'|'+time;slot++;}while(used.has(key));
  e.originalTestDate=e.date;e.originalTestTime=e.time;e.date=date;e.time=time;used.add(key);
 });
 state.duplicateTestSessionsVersion=1;save();
}
function repairFutureSessionResults(){
 if(state.futureSessionResultsVersion)return;
 for(const e of state.events){
  if(e.type!=='session'||!['completed','noshow'].includes(e.status)||eventFinish(e)<=Date.now())continue;
  const id=e.customerId??state.testPrimaryId??state.customer.id;
  const account=String(id)===String(state.customer.id)?state:state.customerAccounts?.[id];
  const debit=e.packageDebit??(e.status==='completed'||e.counts?1:0);
  const previous={status:e.status,counts:e.counts,confirmation:e.confirmation,packageDebit:debit};
  if(account?.package)account.package.usedSessions=Math.max(0,account.package.usedSessions-debit);
  e.status='planned';e.counts=false;e.packageDebit=0;delete e.confirmation;
  (e.resultHistory||(e.resultHistory=[])).push({at:new Date().toISOString(),by:'system',reason:'Gelecekteki seans sonucu düzeltildi',previous,next:{status:'planned',counts:false}});
  if(account)(account.financeHistory||(account.financeHistory=[])).push({date:iso(new Date()),text:'Gelecekteki seans planlıya döndürüldü',detail:e.date+' · '+e.time+' · '+debit+' seans düşümü geri alındı',eventId:e.id});
 }
 state.futureSessionResultsVersion=1;save();
}
function repairFutureDemoResults(){
 if(state.demoResultDatesVersion)return;
 for(const e of state.events){
  const seeded=(e.id===900001&&e.customerId==='demo-ayse')||(e.id>=800000&&e.id<=800035&&String(e.customerId).startsWith('test-customer-'));
  if(!seeded||!['completed','noshow'].includes(e.status)||eventFinish(e)<=Date.now()||e.resolvedAt||e.updatedAt||e.reviewedAt)continue;
  e.originalDemoDate=e.date;e.date=iso(addDays(today,-1));
 }

function progress(){const d=state.progressData||[];const vals=d.map(x=>x.w), min=Math.min(...vals)-1,max=Math.max(...vals)+1;const pts=d.map((x,i)=>{const px=30+i*(540/Math.max(1,d.length-1));const py=190-(x.w-min)/(max-min)*150;return `${px},${py}`}).join(' ');view.innerHTML=`<div class="toolbar"><div><h1>Gelişim</h1><div class="muted">Kilo, ölçü ve ilerleme takibi.</div></div><div class="seg"><button class="active">3 Ay</button><button>6 Ay</button><button>1 Yıl</button></div></div><div class="grid4">${kpi('Başlangıç Kilo','94,0 kg','1 Haziran')}${kpi('Güncel Kilo','89,4 kg','Bugün')}${kpi('Değişim','−4,6 kg','−4,9%')}${kpi('Bel Ölçüsü','95 cm','−9 cm')}</div><div class="grid2" style="margin-top:18px"><div class="card"><h2 class="sectionTitle">Kilo Değişimi</h2><div class="chartBox"><svg viewBox="0 0 600 220" preserveAspectRatio="none"><line x1="30" y1="190" x2="570" y2="190" stroke="#dfe6ea"/><line x1="30" y1="40" x2="30" y2="190" stroke="#dfe6ea"/><polyline points="${pts}" fill="none" stroke="#19b778" stroke-width="4" vector-effect="non-scaling-stroke"/>${d.map((x,i)=>{const px=30+i*(540/Math.max(1,d.length-1));const py=190-(x.w-min)/(max-min)*150;return `<circle cx="${px}" cy="${py}" r="5" fill="#19b778"><title>${x.d}: ${x.w} kg</title></circle>`}).join('')}</svg></div><div class="chartLegend">${d.map(x=>`<span>${x.d}</span>`).join('')}</div></div><div class="card"><h2 class="sectionTitle">Ölçü Gelişimi</h2><div class="history">${d.slice().reverse().map(x=>`<div class="hist"><div><b>${x.d}</b><div class="small muted">Kilo ${x.w} kg</div></div><b>${x.waist} cm bel</b></div>`).join('')}</div><button class="btn primary block" style="margin-top:14px" id="addMeasure">+ Yeni Ölçüm Gir</button></div></div>`;document.querySelector('#addMeasure').onclick=()=>toast('Ölçüm girişi için demo kayıt alanı hazır.')}
function openDemoSession(){openModal(`<h3>Ücretsiz Demo Seansı Planla</h3><div class="notice">Demo seansı finansal borç oluşturmaz ve tarihçede ücretsiz demo olarak saklanır.</div><div class="field"><label>Aday / müşteri</label><input class="input" id="demoName" value="Yeni Aday Müşteri"></div><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="field"><label>Tarih</label><input class="input" type="date" id="demoDate" value="${iso(addDays(today,1))}"></div><div class="field"><label>Saat</label><input class="input" type="time" id="demoTime" value="18:00"></div></div><div class="field"><label>Salon / Lokasyon</label><select id="demoLoc">${state.ptProfile.locations.map(l=>`<option>${l.name}</option>`).join('')}<option>Diğer / Özel Konum</option></select></div><div class="field"><label>Not</label><textarea id="demoNote" rows="2" placeholder="Tanışma ve seviye değerlendirmesi"></textarea></div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="saveDemo">Demo Planla</button></div>`);modal.querySelector('#saveDemo').onclick=()=>{const name=modal.querySelector('#demoName').value||'Aday Müşteri';const date=modal.querySelector('#demoDate').value;state.events.push({id:Date.now(),date,time:modal.querySelector('#demoTime').value,createdBy:eventActor(),type:'demo',title:`Demo · ${name}`,status:'planned',location:modal.querySelector('#demoLoc').value,free:true});state.customer.demoDate=date;save();closeModal();toast('Ücretsiz demo takvime kaydedildi.');nav('calendar')}}
function openMemberLeave(){openModal(`<h3>Müsait Olmadığım Dönem</h3><div class="field"><label>Neden</label><select id="leaveReason"><option>Yıllık İzin</option><option>Seyahat</option><option>Müsait Değilim</option><option>Diğer</option></select></div><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="field"><label>Başlangıç</label><input class="input" type="date" id="leaveStart" value="${iso(addDays(today,5))}"></div><div class="field"><label>Bitiş</label><input class="input" type="date" id="leaveEnd" value="${iso(addDays(today,10))}"></div></div><div class="field"><label>PT'ye not</label><textarea id="leaveNote" rows="2" placeholder="Opsiyonel"></textarea></div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="saveLeave">Takvime İşle</button></div>`);modal.querySelector('#saveLeave').onclick=()=>{let a=new Date(modal.querySelector('#leaveStart').value+'T12:00:00'),b=new Date(modal.querySelector('#leaveEnd').value+'T12:00:00');if(b<a)return toast('Bitiş tarihi başlangıçtan önce olamaz.');const reason=modal.querySelector('#leaveReason').value,groupId='member-leave-'+Date.now();while(a<=b){state.events.push({id:Date.now()+Math.random(),date:iso(a),time:'Tüm gün',customerId:state.customer.id,customerName:state.customer.name,createdBy:eventActor(),groupId,type:'memberoff',note:modal.querySelector('#leaveNote').value,title:reason,status:'off'});a=addDays(a,1)}save();closeModal();toast('Müsait olmadığın dönem PT takvimine işlendi.');calendar()}}
function profilePhotoHtml(photo,initials,id){return `<div class="profilePhoto" id="${id}">${photo?`<img src="${photo}" alt="Profil fotoğrafı">`:initials}</div>`}
function prepareProfilePhoto(file){
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),img=new Image();
  const cleanup=()=>URL.revokeObjectURL(url);
  img.onerror=()=>{cleanup();reject(new Error('Fotoğraf açılamadı. Galeriden JPEG veya PNG biçiminde bir fotoğraf seçmeyi dene.'));};
  img.onload=()=>{
   try{
    if(!img.naturalWidth||!img.naturalHeight)throw new Error('Fotoğraf okunamadı. Lütfen yeniden seç.');
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
    if(!ctx)throw new Error('Fotoğraf işlenemedi. Lütfen tekrar dene.');
    let edge=512,data='';
    for(let i=0;i<4;i++){
     const scale=Math.min(1,edge/Math.max(img.naturalWidth,img.naturalHeight));
     canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
     ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
     ctx.drawImage(img,0,0,canvas.width,canvas.height);
     data=canvas.toDataURL('image/jpeg',0.78-i*0.1);
     if(data.length<=100000)break;
     edge=Math.round(edge*0.75);
    }
    if(!data.startsWith('data:image/jpeg;base64,')||data.length>100000)throw new Error('Fotoğraf küçültülemedi. Başka bir fotoğraf seç.');
    cleanup();resolve(data);
   }catch(error){cleanup();reject(error);}
  };
  img.src=url;
 });
}
function bindProfilePhoto(inputId,previewId,owner,initials){
 const input=document.querySelector('#'+inputId);if(!input)return;
 const profile=state[owner];
 const status=document.createElement('div');status.className='small';status.style.marginTop='8px';status.setAttribute('role','status');status.setAttribute('aria-live','polite');input.closest('label').after(status);
 input.onchange=async()=>{
  const file=input.files&&input.files[0];if(!file)return;
  input.disabled=true;status.textContent='Fotoğraf hazırlanıyor…';
  const previous=profile.photo;
  try{
   // Some phone cameras supply an empty MIME type; decoding validates the image.
   if(file.type&&!file.type.startsWith('image/'))throw new Error('Lütfen bir fotoğraf dosyası seç.');
   const photo=await prepareProfilePhoto(file);
   profile.photo=photo;
   try{save();}catch(error){profile.photo=previous;syncTestAccount();throw new Error('Fotoğraf kaydedilemedi: tarayıcı depolama alanı dolu veya kullanılamıyor. Mevcut fotoğrafın korundu.');}
   if(state[owner]===profile&&input.isConnected){
    const preview=document.querySelector('#'+previewId);
    if(preview){const image=document.createElement('img');image.src=photo;image.alt='Profil fotoğrafı';preview.replaceChildren(image);}
    const active=state.role==='pt'?state.ptProfile:state.customer;
    if(active===profile){const image=document.createElement('img');image.src=photo;image.alt='Profil fotoğrafı';avatar.replaceChildren(image);}
   }
   status.textContent='Fotoğraf kaydedildi.';toast('Profil fotoğrafı kaydedildi.');
  }catch(error){status.textContent=error.message||'Fotoğraf yüklenemedi. Lütfen tekrar dene.';}
  finally{input.disabled=false;input.value='';}
 };
}
function ptProfile(){view.innerHTML=`<div class="toolbar"><div><h1>PT Profilim</h1><div class="muted">Profil bilgilerin ve çalıştığın salonlar.</div></div><button class="btn primary" id="saveProfile">Profili Kaydet</button></div><div class="grid2"><div class="card"><h2 class="sectionTitle">Profil</h2><div class="profileRow"><div>${profilePhotoHtml(state.ptProfile.photo,'MK','ptPhotoPreview')}</div><div><div class="small muted" style="margin-bottom:8px">Profil fotoğrafı</div><label class="photoPicker">Fotoğraf seç<input type="file" id="ptPhoto" accept="image/*"></label></div></div><div class="field"><label>Ad Soyad</label><input class="input" id="pfName" value="${escapeHtml(state.ptProfile.name)}"></div><div class="field"><label>Kısa tanıtım</label><textarea id="pfBio" rows="3">${escapeHtml(state.ptProfile.bio)}</textarea></div><div class="field"><label>Uzmanlık alanları</label><input class="input" id="pfSpec" value="${escapeHtml(state.ptProfile.specialties)}"></div></div><div class="card"><div class="toolbar"><h2 class="sectionTitle">Çalışma Lokasyonları</h2><button class="btn sm ghost" id="addLocation">+ Salon Ekle</button></div><div id="locList">${state.ptProfile.locations.map(l=>`<div class="locationCard"><b>${escapeHtml(l.name)}</b><div class="small muted">${escapeHtml(l.address)}</div></div>`).join('')}</div><div class="notice" style="margin-top:12px">Randevu ve ücretsiz demo planlarken bu salonlardan biri seçilebilir.</div></div></div>`;bindProfilePhoto('ptPhoto','ptPhotoPreview','ptProfile','MK');document.querySelector('#saveProfile').onclick=()=>{state.ptProfile.name=document.querySelector('#pfName').value;state.ptProfile.bio=document.querySelector('#pfBio').value;state.ptProfile.specialties=document.querySelector('#pfSpec').value;save();toast('PT profili kaydedildi.')};document.querySelector('#addLocation').onclick=()=>openAddLocation();renderLocationList()}
function renderLocationList(){
 const list=document.querySelector('#locList');if(!list)return;
 list.innerHTML=state.ptProfile.locations.map(l=>`<div class="locationCard"><b>${escapeHtml(l.name)}</b><div class="small muted">${escapeHtml(l.address)}</div><div class="rightActions" style="margin-top:10px"><button type="button" class="btn sm ghost" data-edit-location="${escapeHtml(String(l.id))}">Düzenle</button><button type="button" class="btn sm red" data-delete-location="${escapeHtml(String(l.id))}">Sil</button></div></div>`).join('')||'<div class="empty">Henüz salon eklenmedi.</div>';
 list.querySelectorAll('[data-edit-location]').forEach(b=>b.onclick=()=>openLocationEdit(b.dataset.editLocation));
 list.querySelectorAll('[data-delete-location]').forEach(b=>b.onclick=()=>openLocationDelete(b.dataset.deleteLocation));
}
function openLocationEdit(id){
 if(state.role!=='pt')return;
 const l=state.ptProfile.locations.find(x=>String(x.id)===String(id));if(!l)return;
 openModal(`<h3>Salonu düzenle</h3><div class="field"><label for="editLocName">Salon adı *</label><input class="input" id="editLocName" value="${escapeHtml(l.name)}"></div><div class="field"><label for="editLocAddress">Adres / Bölge</label><input class="input" id="editLocAddress" value="${escapeHtml(l.address)}"></div><div class="notice">Değişiklik yeni planlamalarda kullanılır. Mevcut seansların salon bilgisi korunur.</div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="saveLocationEdit">Kaydet</button></div>`);
 modal.querySelector('#saveLocationEdit').onclick=()=>{const name=modal.querySelector('#editLocName').value.trim();if(!name)return toast('Salon adını gir.');l.name=name;l.address=modal.querySelector('#editLocAddress').value.trim();save();closeModal();renderLocationList();toast('Salon güncellendi.');};
}
function openLocationDelete(id){
 if(state.role!=='pt')return;
 const l=state.ptProfile.locations.find(x=>String(x.id)===String(id));if(!l)return;
 openModal(`<h3>Salonu sil</h3><p><b>${escapeHtml(l.name)}</b> salonunu silmek istiyor musun?</p><div class="notice">Salon yeni planlamalarda listelenmez. Mevcut seanslar ve geçmiş salon bilgileri korunur.</div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn red" id="confirmLocationDelete">Salonu sil</button></div>`);
 modal.querySelector('#confirmLocationDelete').onclick=()=>{state.ptProfile.locations=state.ptProfile.locations.filter(x=>String(x.id)!==String(id));save();closeModal();renderLocationList();toast('Salon silindi.');};
}
function formatPhoneInput(value){const d=String(value||'').replace(/\D/g,'').slice(0,10);let out=d; if(d.length>3)out=d.slice(0,3)+' '+d.slice(3);if(d.length>6)out=d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6);if(d.length>8)out=d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6,8)+' '+d.slice(8);return out}
function memberProfile(){const c=state.customer;view.innerHTML=`<div class="toolbar"><div><h1>Müşteri Profilim</h1><div class="muted">Kişisel bilgilerini ve profil fotoğrafını yönet.</div></div><button class="btn primary" id="saveMemberProfile">Profili Kaydet</button></div><div class="card" style="max-width:720px"><h2 class="sectionTitle">Profil</h2><div class="profileRow"><div>${profilePhotoHtml(c.photo,'EY','memberPhotoPreview')}</div><div><div class="small muted" style="margin-bottom:8px">Profil fotoğrafı</div><label class="photoPicker">Fotoğraf seç<input type="file" id="memberPhoto" accept="image/*"></label></div></div><div class="field"><label>Ad Soyad *</label><input class="input" id="mfName" value="${escapeHtml(c.name)}" required></div><div class="grid2"><div class="field"><label>Telefon *</label><input class="input" id="mfPhone" type="tel" inputmode="numeric" placeholder="5__ ___ __ __" value="${escapeHtml(c.phone||'')}" required></div><div class="field"><label>E-posta *</label><input class="input" id="mfEmail" type="email" value="${escapeHtml(c.email||'')}" required></div><div class="field"><label>Kan grubu *</label><select id="mfBlood"><option value="">Seçiniz</option>${['A+','A-','B+','B-','AB+','AB-','0+','0-'].map(x=>`<option ${c.blood===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Cinsiyet *</label><select id="mfGender"><option value="">Seçiniz</option>${['Kadın','Erkek','Belirtmek istemiyor'].map(x=>`<option ${c.gender===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Kilo (kg) *</label><input class="input" id="mfWeight" type="number" step="0.1" value="${c.weight??''}" required></div><div class="field"><label>Boy (cm) *</label><input class="input" id="mfHeight" type="number" value="${c.height??''}" required></div></div><div class="small muted" style="margin-top:8px">Telefon biçimi: 5__ ___ __ __</div></div>`;bindProfilePhoto('memberPhoto','memberPhotoPreview','customer','EY');document.querySelector('#mfPhone').oninput=e=>{e.target.value=formatPhoneInput(e.target.value)};document.querySelector('#saveMemberProfile').onclick=()=>{const fields={name:document.querySelector('#mfName').value.trim(),phone:document.querySelector('#mfPhone').value.trim(),email:document.querySelector('#mfEmail').value.trim(),blood:document.querySelector('#mfBlood').value,gender:document.querySelector('#mfGender').value,weight:document.querySelector('#mfWeight').value,height:document.querySelector('#mfHeight').value};if(!/^5\d{2} \d{3} \d{2} \d{2}$/.test(fields.phone)||Object.values(fields).some(x=>!x))return toast('Lütfen yıldızlı alanların tamamını doğru biçimde doldur.');Object.assign(c,{...fields,weight:+fields.weight,height:+fields.height});save();toast('Müşteri profili kaydedildi.');memberProfile()}}

function openAddLocation(){openModal(`<h3>Salon / Lokasyon Ekle</h3><div class="field"><label>Salon adı</label><input class="input" id="locName" placeholder="Örn. FitLife Lara"></div><div class="field"><label>Adres / Bölge</label><input class="input" id="locAddr" placeholder="Lara, Antalya"></div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="saveLoc">Ekle</button></div>`);modal.querySelector('#saveLoc').onclick=()=>{const n=modal.querySelector('#locName').value.trim();if(!n)return toast('Salon adını gir.');state.ptProfile.locations.push({id:Date.now(),name:n,address:modal.querySelector('#locAddr').value});save();closeModal();toast('Salon eklendi.');ptProfile()}}
function openModal(html){modal.innerHTML=html;modalBack.classList.add('show');modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){modalBack.classList.remove('show')}modalBack.onclick=e=>{if(e.target===modalBack)closeModal()}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));document.querySelector('#resetBtn').onclick=()=>{state=cleanDemoState(state);save();toast('Demo temizlendi.');render()};
window.addEventListener('storage',e=>{if(e.key==='pitiDemoV4'&&!modalBack.classList.contains('show')){const role=state.role,page=state.page;state=load();state.role=role;state.page=page;render();}});
setInterval(()=>{if(['dashboard','today','calendar'].includes(state.page)&&!modalBack.classList.contains('show'))render();},60000);
render();maybeOpenJoinLink();initAuth();
})();
