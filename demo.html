<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Piti – Çalışan Web Demo</title>
<style>
:root{
  --bg:#f5f7f8; --card:#fff; --text:#122033; --muted:#6f7b8b; --line:#e5eaee;
  --green:#2563eb; --green2:#1d4ed8; --greenSoft:#eff6ff; --blue:#3b82f6;
  --amber:#f59e0b; --red:#ef5350; --purple:#7c3aed; --shadow:0 10px 30px rgba(24,38,52,.08);
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px}.brandMark{font-size:30px;font-weight:900;letter-spacing:-1.4px}.brandMark i{font-style:normal;color:var(--green)}.tag{color:var(--muted);font-size:14px}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#d8e7ff,#dbeafe);display:grid;place-items:center;font-weight:800}.pill{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;color:var(--text)}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 68px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.navBtn{width:100%;border:0;background:transparent;padding:12px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;color:#526071;margin:3px 0;text-align:left}.navBtn.active{background:var(--greenSoft);color:var(--green2);font-weight:700}.navBtn:hover{background:#f3f6f7}.navIcon{width:24px;text-align:center}.content{padding:26px;max-width:1480px;width:100%;margin:0 auto}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}.kpi{min-height:118px}.kpiLabel{color:var(--muted);font-size:13px}.kpiVal{font-size:28px;font-weight:850;margin-top:8px}.kpiHint{font-size:12px;color:var(--muted);margin-top:6px}.sectionTitle{font-weight:850;font-size:20px;margin:0 0 14px}.subTitle{font-weight:750;font-size:15px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--green2)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.amber{background:#fff3d7;color:#a76000}.btn.red{background:#ffebea;color:#b22a27}.btn.blue{background:#eaf2ff;color:#225fc2}.btn.sm{padding:7px 10px;font-size:12px}.btn.block{width:100%}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}.toolbar h1{margin:0;font-size:28px;letter-spacing:-.4px}.seg{display:flex;background:#eef2f3;border-radius:12px;padding:4px}.seg button{border:0;background:transparent;border-radius:9px;padding:8px 12px;color:var(--muted)}.seg button.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.06);font-weight:700}
.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{color:var(--muted);font-weight:650;font-size:12px}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.status.green{background:var(--greenSoft);color:var(--green2)}.status.amber{background:#fff2d5;color:#a66700}.status.red{background:#ffe9e8;color:#bd2e2b}.status.blue{background:#eaf2ff;color:#2f67c7}.status.gray{background:#eef2f3;color:#65707c}
.calendarWrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}.calendar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calTitle{font-size:20px;font-weight:850}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{color:var(--muted);font-size:12px;text-align:center;padding:8px 0}.day{min-height:94px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;position:relative;text-align:left}.day:hover{border-color:#93c5fd;background:#f8fbff}.day.dim{opacity:.42}.day.today{outline:2px solid var(--green)}.day.selected{background:var(--greenSoft);border-color:#bfdbfe}.dayNum{font-weight:800;font-size:13px}.dotRow{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.dot{width:8px;height:8px;border-radius:50%}.dot.green{background:var(--green)}.dot.blue{background:var(--blue)}.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dayBadge{display:block;margin-top:7px;font-size:10px;border-radius:8px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dayBadge.green{background:var(--greenSoft);color:var(--green2)}.dayBadge.blue{background:#edf4ff;color:#2f67c7}.dayBadge.red{background:#ffeceb;color:#b82b28}.dayBadge.amber{background:#fff4dc;color:#9b6500}
.eventItem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}.eventTop{display:flex;justify-content:space-between;gap:12px}.eventTitle{font-weight:800}.eventMeta{font-size:12px;color:var(--muted);margin-top:3px}.empty{padding:22px;text-align:center;border:1px dashed #cfd8de;border-radius:12px;color:var(--muted)}
.progress{height:10px;background:#e9eef0;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#60a5fa);border-radius:999px}.packageHero{padding:20px;border-radius:18px;background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff}.packageTop{display:flex;justify-content:space-between;gap:16px}.big{font-size:34px;font-weight:900}.packageStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.packageStat{background:rgba(255,255,255,.14);padding:12px;border-radius:12px}.packageStat b{font-size:20px;display:block}.packageStat span{font-size:11px;opacity:.9}.history{display:flex;flex-direction:column;gap:8px}.hist{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.chat{height:380px;overflow:auto;background:#fafcfc;border:1px solid var(--line);border-radius:14px;padding:14px}.msg{max-width:75%;padding:10px 12px;border-radius:14px;margin:7px 0;line-height:1.35}.msg.me{margin-left:auto;background:#dbeafe}.msg.them{background:#fff;border:1px solid var(--line)}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:650}.input,select,textarea{border:1px solid #d8e0e5;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);width:100%}.modalBack{position:fixed;inset:0;background:rgba(11,22,32,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.modalBack.show{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:20px;box-shadow:0 28px 70px rgba(0,0,0,.22);padding:20px;max-height:92vh;overflow:auto}.modal h3{margin:0 0 12px;font-size:21px}.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;background:#122033;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);transform:translateY(30px);opacity:0;pointer-events:none;transition:.2s;z-index:200}.toast.show{transform:none;opacity:1}.uploadBox{border:1px dashed #b9c5cd;border-radius:12px;padding:14px;text-align:center;background:#fafcfc}.receiptName{margin-top:8px;font-size:12px;color:var(--muted)}
.mobileMenu{display:none}.notice{padding:11px 13px;border-radius:12px;background:#edf8ff;color:#2b608c;font-size:13px;border:1px solid #d9edf9}.rightActions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2,.calendarWrap{grid-template-columns:1fr}.shell{grid-template-columns:84px 1fr}.sidebar .navText{display:none}.sidebar{padding:18px 10px}.navBtn{justify-content:center}.tag{display:none}}
@media(max-width:720px){.topbar{padding:0 14px}.content{padding:14px}.shell{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:68px;border-right:0;border-top:1px solid var(--line);display:flex;padding:7px;background:#fff}.navBtn{flex:1;margin:0;padding:7px 4px;display:flex;flex-direction:column;gap:3px;font-size:10px}.sidebar .navText{display:block}.navIcon{height:18px}.content{padding-bottom:88px}.grid4{grid-template-columns:1fr 1fr}.userbox .pill{display:none}.calendar .day{min-height:72px;padding:6px}.dayBadge{display:none}.packageStats{grid-template-columns:1fr}.toolbar h1{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandMark">P<i>i</i>ti</div><div class="tag">PT’nle arandaki her şey.</div></div>
    <div class="userbox">
      <div class="seg" id="roleSeg"><button data-role="pt" class="active">PT</button><button data-role="member">Müşteri</button></div>
      <button class="pill" id="resetBtn">Demoyu sıfırla</button>
      <div class="avatar" id="avatar">MK</div>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="modalBack" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
const TR = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const today = new Date(); today.setHours(0,0,0,0);
const iso = d => { const x=new Date(d); x.setHours(12,0,0,0); return x.toISOString().slice(0,10); };
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n);
const demoStart = addDays(today,-9), demoEnd = addDays(demoStart,30);
const seed = {
 role:'pt', page:'dashboard', calCursor:new Date(today.getFullYear(),today.getMonth(),1).toISOString(), selectedDate:iso(today),
 customer:{id:1,name:'Erkan Yardibi',initials:'EY',weight:89.4},
 package:{name:'12 Seans / 30 Gün',price:7500,start:iso(demoStart),end:iso(demoEnd),totalSessions:12,usedSessions:4,freezeDays:0,status:'active',rule:'Hangisi önce biterse'},
 payment:{status:'pending',amount:7500,method:'EFT/Havale',receipt:'EFT_Dekontu.pdf',submitted:true,submittedAt:iso(addDays(today,-1))},
 events:[
  {id:1,date:iso(addDays(today,-7)),time:'19:00',type:'session',title:'Çekiş Günü',status:'completed',counts:true},
  {id:2,date:iso(addDays(today,-4)),time:'18:30',type:'session',title:'İtiş Günü',status:'completed',counts:true},
  {id:3,date:iso(today),time:'21:00',type:'session',title:'Bacak Günü',status:'planned',counts:true},
  {id:4,date:iso(addDays(today,2)),time:'18:00',type:'availability',title:'Müsait',status:'open'},
  {id:5,date:iso(addDays(today,4)),time:'20:00',type:'availability',title:'Müsait',status:'open'},
  {id:6,date:iso(addDays(today,6)),time:'10:00',type:'off',title:'İzinli',status:'off'}
 ],
 tasks:[{id:1,title:'Sabah tartıl',date:iso(today),status:'done',result:'89,4 kg'},{id:2,title:'2,5 litre su iç',date:iso(today),status:'open',result:''},{id:3,title:'Öğle yemeğinin fotoğrafını gönder',date:iso(today),status:'open',result:''}],
 messages:[{from:'pt',text:'Akşam bacak çalışacağız. Antrenmandan önce çok ağır yemek yeme. 💪'},{from:'member',text:'Tamam hocam 👍'}],
 financeHistory:[{date:iso(addDays(today,-9)),text:'Paket başlatıldı',detail:'12 Seans / 30 Gün'},{date:iso(addDays(today,-7)),text:'Seans işlendi',detail:'Çekiş Günü'},{date:iso(addDays(today,-4)),text:'Seans işlendi',detail:'İtiş Günü'}]
};
let state = load();
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const s=localStorage.getItem('pitiDemoV2');return s?JSON.parse(s):clone(seed)}catch{return clone(seed)}}
function save(){localStorage.setItem('pitiDemoV2',JSON.stringify(state))}
function daysLeft(){ const e=new Date(state.package.end+'T00:00:00'); const t=new Date();t.setHours(0,0,0,0); return Math.max(0,Math.ceil((e-t)/86400000)); }
function sessionsLeft(){return Math.max(0,state.package.totalSessions-state.package.usedSessions)}
function packageEnded(){return daysLeft()<=0 || sessionsLeft()<=0}
const navPT=[['dashboard','⌂','Ana Sayfa'],['customers','👥','Müşteriler'],['calendar','▣','Takvim'],['finance','₺','Ödemeler'],['messages','◌','Mesajlar']];
const navM=[['today','⌂','Bugün'],['calendar','▣','Takvim'],['finance','₺','Paketim'],['messages','◌','Mesajlar'],['progress','↗','Gelişim']];
function setRole(role){state.role=role;state.page=role==='pt'?'dashboard':'today';save();render()}
function nav(page){state.page=page;save();render()}
function renderNav(){const items=state.role==='pt'?navPT:navM; sidebar.innerHTML=items.map(([p,i,t])=>`<button class="navBtn ${state.page===p?'active':''}" data-nav="${p}"><span class="navIcon">${i}</span><span class="navText">${t}</span></button>`).join('');sidebar.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));}
function render(){renderNav(); document.querySelectorAll('#roleSeg button').forEach(b=>b.classList.toggle('active',b.dataset.role===state.role)); avatar.textContent=state.role==='pt'?'MK':'EY';
 const map={dashboard:dashboard,customers:customers,calendar:calendar,finance:finance,messages:messages,today:memberToday,progress:progress}; (map[state.page]||dashboard)(); }
function kpi(label,val,hint){return `<div class="card kpi"><div class="kpiLabel">${label}</div><div class="kpiVal">${val}</div><div class="kpiHint">${hint}</div></div>`}
function dashboard(){view.innerHTML=`
 <div class="toolbar"><div><h1>Günaydın Mehmet 👋</h1><div class="muted">Bugün neler var?</div></div><button class="btn primary" id="addAvail">+ Müsaitlik Ekle</button></div>
 <div class="grid4">${kpi('PT Seansı','8','Bugün')}${kpi('Randevu Talebi','3','Bekliyor')}${kpi('Geciken Görev','4','Dikkat')}${kpi('Ödeme / Paket','1','Onay bekliyor')}</div>
 <div class="grid2" style="margin-top:18px">
  <div class="card"><h2 class="sectionTitle">Bugünkü Seanslar</h2><div class="tableWrap"><table class="table"><thead><tr><th>Saat</th><th>Müşteri</th><th>Plan</th><th>Durum</th><th></th></tr></thead><tbody>
  <tr><td>09:00</td><td>Ayşe Demir</td><td>İtiş Günü</td><td><span class="status green">Tamamlandı</span></td><td></td></tr>
  <tr><td>14:00</td><td>Zeynep Arslan</td><td>Core & Kardiyo</td><td><span class="status blue">Planlı</span></td><td></td></tr>
  <tr><td>21:00</td><td>${state.customer.name}</td><td>Bacak Günü</td><td><span class="status amber">Bekliyor</span></td><td><button class="btn sm ghost" data-open-cust>Detay</button></td></tr>
  </tbody></table></div></div>
  <div class="card"><h2 class="sectionTitle">${state.customer.name}</h2>
   <div class="packageHero"><div class="packageTop"><div><div class="small" style="opacity:.85">Aktif Paket</div><div style="font-size:20px;font-weight:850">${state.package.name}</div></div><span>${packageEnded()?'Bitti':'Aktif'}</span></div>
   <div class="packageStats"><div class="packageStat"><b>${sessionsLeft()}</b><span>Kalan seans</span></div><div class="packageStat"><b>${daysLeft()}</b><span>Kalan gün</span></div><div class="packageStat"><b>${state.package.usedSessions}/${state.package.totalSessions}</b><span>Kullanım</span></div></div></div>
   <div style="margin-top:14px"><div class="subTitle">Ödeme</div>${paymentStatusHtml()}<div class="rightActions" style="margin-top:10px">${state.payment.status==='pending'?'<button class="btn primary" id="approvePay">Ödemeyi Onayla</button><button class="btn red" id="rejectPay">Reddet</button>':''}<button class="btn ghost" data-nav-finance>Finans Detayı</button></div></div>
  </div>
 </div>`;
 document.querySelector('#addAvail').onclick=()=>openAvailability();
 document.querySelector('[data-open-cust]').onclick=()=>nav('customers');
 document.querySelector('[data-nav-finance]').onclick=()=>nav('finance');
 if(document.querySelector('#approvePay')) document.querySelector('#approvePay').onclick=approvePayment;
 if(document.querySelector('#rejectPay')) document.querySelector('#rejectPay').onclick=rejectPayment;
}
function paymentStatusHtml(){const p=state.payment; const cls=p.status==='approved'?'green':p.status==='pending'?'amber':p.status==='rejected'?'red':'gray'; const txt=p.status==='approved'?'Ödendi / Onaylandı':p.status==='pending'?'Dekont gönderildi – onay bekliyor':p.status==='rejected'?'Reddedildi':'Ödenmedi'; return `<span class="status ${cls}">${txt}</span><div class="small muted" style="margin-top:7px">${money(p.amount)} · ${p.method}${p.receipt?' · '+p.receipt:''}</div>`}
function customers(){view.innerHTML=`<div class="toolbar"><div><h1>Müşteriler</h1><div class="muted">Müşteri, paket ve ödeme durumlarını tek yerde gör.</div></div></div>
<div class="card"><table class="table"><thead><tr><th>Müşteri</th><th>Paket</th><th>Kalan</th><th>Ödeme</th><th>Bugün</th><th></th></tr></thead><tbody><tr><td><b>${state.customer.name}</b><div class="small muted">89,4 kg</div></td><td>${state.package.name}</td><td><b>${sessionsLeft()} seans</b> / ${daysLeft()} gün</td><td>${paymentStatusHtml()}</td><td>21:00 · Bacak Günü</td><td><button class="btn sm primary" id="custFinance">Finans</button></td></tr></tbody></table></div>`;document.querySelector('#custFinance').onclick=()=>nav('finance')}
function calendar(){ const cursor=new Date(state.calCursor); const y=cursor.getFullYear(),m=cursor.getMonth(); const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay()); const cells=[]; for(let i=0;i<42;i++) cells.push(addDays(start,i));
 const selected=state.selectedDate||iso(today); const selEvents=state.events.filter(e=>e.date===selected).sort((a,b)=>a.time.localeCompare(b.time));
 view.innerHTML=`<div class="toolbar"><div><h1>Takvim</h1><div class="muted">Geçmişi, geleceği, randevuları ve müsaitliği yönet.</div></div>${state.role==='pt'?'<button class="btn primary" id="calAdd">+ Müsaitlik / İzin Ekle</button>':''}</div>
 <div class="calendarWrap"><div class="calendar"><div class="calHead"><button class="btn ghost" id="prevM">‹ Önceki</button><div class="calTitle">${MONTHS[m]} ${y}</div><div><button class="btn ghost" id="todayM">Bugün</button> <button class="btn ghost" id="nextM">Sonraki ›</button></div></div>
 <div class="week">${TR.map(d=>`<div>${d}</div>`).join('')}</div><div class="days">${cells.map(d=>dayCell(d,m,selected)).join('')}</div></div>
 <div class="card"><h2 class="sectionTitle">${formatDate(selected)}</h2>${selEvents.length?selEvents.map(eventCard).join(''):'<div class="empty">Bu güne ait kayıt yok.</div>'}
 ${state.role==='member'?memberRequestBox(selected):''}</div></div>`;
 document.querySelectorAll('.day[data-date]').forEach(b=>b.onclick=()=>{state.selectedDate=b.dataset.date;save();calendar()});
 document.querySelector('#prevM').onclick=()=>moveMonth(-1);document.querySelector('#nextM').onclick=()=>moveMonth(1);document.querySelector('#todayM').onclick=()=>{state.calCursor=new Date(today.getFullYear(),today.getMonth(),1).toISOString();state.selectedDate=iso(today);save();calendar()};
 if(document.querySelector('#calAdd')) document.querySelector('#calAdd').onclick=()=>openAvailability(state.selectedDate);
 document.querySelectorAll('[data-complete-session]').forEach(b=>b.onclick=()=>completeSession(+b.dataset.completeSession));
 document.querySelectorAll('[data-noshow]').forEach(b=>b.onclick=()=>openNoShow(+b.dataset.noshow));
 document.querySelectorAll('[data-request-slot]').forEach(b=>b.onclick=()=>requestSlot(+b.dataset.requestSlot));
}
function dayCell(d,month,selected){const ds=iso(d), ev=state.events.filter(e=>e.date===ds); const cls=['day']; if(d.getMonth()!==month)cls.push('dim'); if(ds===iso(today))cls.push('today'); if(ds===selected)cls.push('selected'); const badges=ev.slice(0,2).map(e=>`<span class="dayBadge ${eventColor(e)}">${e.time} ${e.title}</span>`).join(''); return `<button class="${cls.join(' ')}" data-date="${ds}"><span class="dayNum">${d.getDate()}</span>${badges}<div class="dotRow">${ev.slice(0,4).map(e=>`<span class="dot ${eventColor(e)}"></span>`).join('')}</div></button>`}
function eventColor(e){return e.type==='availability'?'green':e.type==='off'?'red':e.status==='completed'?'blue':e.status==='noshow'?'amber':'blue'}
function eventCard(e){let actions=''; if(state.role==='pt'&&e.type==='session'&&e.status==='planned') actions=`<div class="rightActions" style="margin-top:10px"><button class="btn sm primary" data-complete-session="${e.id}">Seansı Tamamla</button><button class="btn sm amber" data-noshow="${e.id}">No Show</button></div>`; if(state.role==='member'&&e.type==='availability'&&e.status==='open') actions=`<button class="btn sm primary" style="margin-top:10px" data-request-slot="${e.id}">Bu Saati Talep Et</button>`; return `<div class="eventItem"><div class="eventTop"><div><div class="eventTitle">${e.time} · ${e.title}</div><div class="eventMeta">${e.type==='session'?'PT Seansı':e.type==='availability'?'Müsaitlik':'Takvim durumu'} · ${statusText(e)}</div></div><span class="status ${e.status==='completed'?'green':e.status==='noshow'?'amber':e.type==='off'?'red':'blue'}">${statusText(e)}</span></div>${actions}</div>`}
function statusText(e){return e.status==='completed'?'Tamamlandı':e.status==='planned'?'Planlı':e.status==='noshow'?(e.counts?'No Show · Sayıldı':'No Show · Sayılmadı'):e.status==='requested'?'Talep gönderildi':e.type==='availability'?'Uygun':'Kapalı'}
function memberRequestBox(date){const open=state.events.filter(e=>e.date===date&&e.type==='availability'&&e.status==='open'); return open.length?`<div style="margin-top:15px"><div class="subTitle">PT'nin müsait saatleri</div>${open.map(e=>`<div class="eventItem"><b>${e.time}</b><button class="btn sm primary" style="float:right" data-request-slot="${e.id}">Talep Et</button></div>`).join('')}</div>`:''}
function moveMonth(n){const d=new Date(state.calCursor);d.setMonth(d.getMonth()+n);state.calCursor=d.toISOString();save();calendar()}
function formatDate(s){return new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'}).format(new Date(s+'T12:00:00'))}
function openAvailability(date=state.selectedDate){openModal(`<h3>Takvime kayıt ekle</h3><div class="field"><label>Tarih</label><input class="input" type="date" id="aDate" value="${date||iso(today)}"></div><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="field"><label>Başlangıç saati</label><input class="input" type="time" id="aTime" value="18:00"></div><div class="field"><label>Durum</label><select id="aType"><option value="availability">Müsait</option><option value="off">İzinli</option><option value="excused">Mazeretli</option><option value="closed">Çalışmıyor</option></select></div></div><div class="field"><label>Müşteri görünürlüğü</label><select id="aVis"><option>Seçili müşteriler görebilir</option><option>Hiçbir müşteri göremez</option><option>Tüm müşteriler görebilir</option></select></div><div class="notice">Müşteri, izin/mazeret detayını görmez; yalnızca saatin uygun olmadığını görür.</div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="saveAvail">Kaydet</button></div>`); modal.querySelector('#saveAvail').onclick=()=>{const type=modal.querySelector('#aType').value; const map={availability:'Müsait',off:'İzinli',excused:'Mazeretli',closed:'Çalışmıyor'};state.events.push({id:Date.now(),date:modal.querySelector('#aDate').value,time:modal.querySelector('#aTime').value,type:type==='availability'?'availability':'off',title:map[type],status:type==='availability'?'open':'off'});save();closeModal();toast('Takvim kaydı eklendi.');calendar()}}
function finance(){const pay=state.payment; const progressPct=Math.round(state.package.usedSessions/state.package.totalSessions*100); view.innerHTML=`<div class="toolbar"><div><h1>${state.role==='pt'?'Ödemeler & Paketler':'Paketim & Ödemelerim'}</h1><div class="muted">Seans, süre, ödeme ve No Show takibi.</div></div>${state.role==='pt'?'<button class="btn primary" id="newPackage">Paket Düzenle</button>':''}</div>
<div class="grid2"><div><div class="packageHero"><div class="packageTop"><div><div class="small" style="opacity:.85">${state.customer.name}</div><div style="font-size:23px;font-weight:900">${state.package.name}</div><div class="small" style="margin-top:4px;opacity:.9">${state.package.rule}</div></div><div style="text-align:right"><div class="big">${sessionsLeft()}</div><div class="small">seans kaldı</div></div></div><div class="packageStats"><div class="packageStat"><b>${daysLeft()}</b><span>Gün kaldı</span></div><div class="packageStat"><b>${state.package.usedSessions}</b><span>Kullanılan</span></div><div class="packageStat"><b>${money(state.package.price)}</b><span>Paket tutarı</span></div></div><div style="margin-top:14px"><div class="small" style="margin-bottom:6px">Seans kullanımı</div><div class="progress"><span style="width:${progressPct}%"></span></div></div></div>
<div class="card" style="margin-top:16px"><h2 class="sectionTitle">Hareket Geçmişi</h2><div class="history">${state.financeHistory.slice().reverse().map(h=>`<div class="hist"><div><b>${h.text}</b><div class="small muted">${h.detail}</div></div><div class="small muted">${formatShort(h.date)}</div></div>`).join('')}</div></div></div>
<div><div class="card"><h2 class="sectionTitle">Ödeme Durumu</h2>${paymentStatusHtml()}<div style="margin-top:14px"><div class="subTitle">${money(pay.amount)}</div><div class="small muted">${pay.method}</div></div>${pay.receipt?`<div class="uploadBox" style="margin-top:14px">📎 <b>${pay.receipt}</b><div class="receiptName">Müşteri tarafından iletilen dekont</div></div>`:''}
<div class="rightActions" style="margin-top:14px">${state.role==='pt'&&pay.status==='pending'?'<button class="btn primary" id="approvePay">Onayla</button><button class="btn red" id="rejectPay">Reddet</button>':''}${state.role==='member'&&pay.status!=='approved'?'<button class="btn primary" id="paidBtn">Ödedim / Dekont Gönder</button>':''}</div></div>
<div class="card" style="margin-top:16px"><h2 class="sectionTitle">Kurallar</h2><div class="hist"><div><b>Paket bitişi</b><div class="small muted">30 gün veya 12 seans</div></div><span class="status blue">Hangisi önce</span></div><div class="hist"><div><b>No Show</b><div class="small muted">Mazerete göre seanstan düşebilir</div></div><span class="status amber">PT karar verir</span></div></div></div></div>`;
 if(document.querySelector('#approvePay'))document.querySelector('#approvePay').onclick=approvePayment;if(document.querySelector('#rejectPay'))document.querySelector('#rejectPay').onclick=rejectPayment;if(document.querySelector('#paidBtn'))document.querySelector('#paidBtn').onclick=openReceipt;if(document.querySelector('#newPackage'))document.querySelector('#newPackage').onclick=openPackage;}
function formatShort(s){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'short'}).format(new Date(s+'T12:00:00'))}
function approvePayment(){state.payment.status='approved';state.financeHistory.push({date:iso(today),text:'Ödeme onaylandı',detail:`${money(state.payment.amount)} · ${state.payment.method}`});save();toast('Ödeme onaylandı.');render()}
function rejectPayment(){state.payment.status='rejected';state.financeHistory.push({date:iso(today),text:'Ödeme reddedildi',detail:'Dekont/ödeme kontrolü gerekli'});save();toast('Ödeme reddedildi.');render()}
function openReceipt(){openModal(`<h3>Ödeme bildirimi</h3><div class="field"><label>Ödenen tutar</label><input class="input" type="number" id="rAmount" value="${state.package.price}"></div><div class="field"><label>Ödeme yöntemi</label><select id="rMethod"><option>EFT/Havale</option><option>Nakit</option><option>Diğer</option></select></div><div class="uploadBox"><div>📎 Dekont seç</div><input type="file" id="rFile" accept="image/*,.pdf" style="margin-top:10px"></div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="sendReceipt">PT'ye Gönder</button></div>`);modal.querySelector('#sendReceipt').onclick=()=>{const f=modal.querySelector('#rFile').files[0];state.payment={status:'pending',amount:+modal.querySelector('#rAmount').value,method:modal.querySelector('#rMethod').value,receipt:f?f.name:'Dekont eklenmedi',submitted:true,submittedAt:iso(today)};state.financeHistory.push({date:iso(today),text:'Ödeme bildirimi gönderildi',detail:state.payment.receipt});save();closeModal();toast('Ödeme bildirimi PT’ye gönderildi.');finance()}}
function openPackage(){openModal(`<h3>Paket düzenle</h3><div class="field"><label>Paket adı</label><input class="input" id="pName" value="${state.package.name}"></div><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="field"><label>Seans sayısı</label><input class="input" type="number" id="pSess" value="${state.package.totalSessions}"></div><div class="field"><label>Süre (gün)</label><input class="input" type="number" id="pDays" value="30"></div></div><div class="field"><label>Paket fiyatı</label><input class="input" type="number" id="pPrice" value="${state.package.price}"></div><div class="field"><label>Bitiş kuralı</label><select id="pRule"><option>Hangisi önce biterse</option><option>Sadece seans bitince</option><option>Sadece süre bitince</option></select></div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="savePackage">Kaydet</button></div>`);modal.querySelector('#savePackage').onclick=()=>{const days=+modal.querySelector('#pDays').value;state.package.name=modal.querySelector('#pName').value;state.package.totalSessions=+modal.querySelector('#pSess').value;state.package.price=+modal.querySelector('#pPrice').value;state.package.rule=modal.querySelector('#pRule').value;state.package.end=iso(addDays(new Date(state.package.start+'T12:00:00'),days));save();closeModal();toast('Paket güncellendi.');finance()}}
function completeSession(id){const e=state.events.find(x=>x.id===id);if(!e||e.status==='completed')return;e.status='completed';state.package.usedSessions=Math.min(state.package.totalSessions,state.package.usedSessions+1);state.financeHistory.push({date:e.date,text:'Seans işlendi',detail:e.title});save();toast('Seans işlendi; paket güncellendi.');calendar()}
function openNoShow(id){const e=state.events.find(x=>x.id===id);openModal(`<h3>No Show işlemi</h3><div class="notice">Mazerete göre bu seansı paketten düşebilir veya düşmeyebilirsin.</div><div class="field"><label>Müşteri durumu</label><select id="nsReason"><option>Mazeretsiz gelmedi</option><option>Mazeretli gelmedi</option><option>Geç iptal</option><option>PT iptali</option></select></div><div class="field"><label>Seans paketten düşsün mü?</label><select id="nsCount"><option value="yes">Evet, seans say</option><option value="no">Hayır, sayma</option></select></div><div class="field"><label>Not</label><textarea id="nsNote" rows="3" placeholder="Opsiyonel not"></textarea></div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn amber" id="saveNs">No Show Kaydet</button></div>`);modal.querySelector('#saveNs').onclick=()=>{const count=modal.querySelector('#nsCount').value==='yes';e.status='noshow';e.counts=count;e.noShowReason=modal.querySelector('#nsReason').value;if(count)state.package.usedSessions=Math.min(state.package.totalSessions,state.package.usedSessions+1);state.financeHistory.push({date:e.date,text:'No Show kaydedildi',detail:`${e.noShowReason} · ${count?'Seans sayıldı':'Seans sayılmadı'}`});save();closeModal();toast('No Show işlendi.');calendar()}}
function requestSlot(id){const e=state.events.find(x=>x.id===id);e.status='requested';e.type='session';e.title='PT Randevu Talebi';state.messages.push({from:'member',text:`${formatShort(e.date)} ${e.time} için randevu talep ettim.`});save();toast('Randevu talebi PT’ye gönderildi.');calendar()}
function memberToday(){const todays=state.events.filter(e=>e.date===iso(today));const session=todays.find(e=>e.type==='session');view.innerHTML=`<div class="toolbar"><div><h1>Merhaba Erkan 👋</h1><div class="muted">Bugün ne yapman gerekiyor?</div></div></div>
<div class="grid2"><div><div class="card"><div class="small muted">BUGÜN · ${formatDate(iso(today)).toUpperCase()}</div>${session?`<div style="margin-top:10px;font-size:28px;font-weight:900">${session.time}</div><div style="font-size:20px;font-weight:800">PT Antrenmanı · ${session.title}</div><div class="rightActions" style="margin-top:14px"><button class="btn primary" id="going">Geleceğim</button><button class="btn amber" id="late">Gecikeceğim</button><button class="btn ghost" id="resched">Değişiklik İste</button></div>`:'<div class="empty">Bugün PT seansı yok.</div>'}</div>
<div class="card" style="margin-top:16px"><h2 class="sectionTitle">Bugünkü Görevler</h2>${state.tasks.filter(t=>t.date===iso(today)).map(t=>`<div class="hist"><div><b>${t.title}</b><div class="small muted">${t.status==='done'?t.result:'Bekliyor'}</div></div><span class="status ${t.status==='done'?'green':'amber'}">${t.status==='done'?'Tamamlandı':'Açık'}</span></div>`).join('')}</div></div>
<div><div class="packageHero"><div class="small" style="opacity:.85">Paketim</div><div style="font-size:22px;font-weight:900">${state.package.name}</div><div class="packageStats"><div class="packageStat"><b>${sessionsLeft()}</b><span>Seans</span></div><div class="packageStat"><b>${daysLeft()}</b><span>Gün</span></div><div class="packageStat"><b>${state.payment.status==='approved'?'✓':'!'}</b><span>Ödeme</span></div></div></div><div class="card" style="margin-top:16px"><h2 class="sectionTitle">PT’den Mesaj</h2><div>${state.messages[state.messages.length-1].text}</div><button class="btn ghost" style="margin-top:12px" id="goMsg">Mesajlara Git</button></div></div></div>`;
 if(document.querySelector('#going'))document.querySelector('#going').onclick=()=>toast('PT’ye “geleceğim” bildirimi gönderildi.');if(document.querySelector('#late'))document.querySelector('#late').onclick=()=>openLate();if(document.querySelector('#resched'))document.querySelector('#resched').onclick=()=>openReschedule();document.querySelector('#goMsg').onclick=()=>nav('messages')}
function openLate(){openModal(`<h3>Gecikeceğim</h3><div class="field"><label>Yaklaşık gecikme</label><select id="lateM"><option>5 dakika</option><option selected>10 dakika</option><option>15 dakika</option><option>30 dakika</option></select></div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn amber" id="sendLate">PT'ye Bildir</button></div>`);modal.querySelector('#sendLate').onclick=()=>{const m=modal.querySelector('#lateM').value;state.messages.push({from:'member',text:`Bugünkü randevuya yaklaşık ${m} gecikeceğim.`});save();closeModal();toast('Gecikme PT’ye bildirildi.')}}
function openReschedule(){const opts=state.events.filter(e=>e.type==='availability'&&e.status==='open'&&new Date(e.date)>=today);openModal(`<h3>Randevu değişikliği iste</h3><div class="field"><label>Sebep</label><textarea id="rsReason" rows="3" placeholder="Örn. toplantım uzayacak"></textarea></div><div class="field"><label>Yeni uygun saat</label><select id="rsSlot">${opts.map(e=>`<option value="${e.id}">${formatShort(e.date)} · ${e.time}</option>`).join('')||'<option value="">Uygun slot yok</option>'}</select></div><div class="modalFoot"><button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" id="sendRs">Talep Gönder</button></div>`);modal.querySelector('#sendRs').onclick=()=>{const id=+modal.querySelector('#rsSlot').value;if(id){const e=state.events.find(x=>x.id===id);state.messages.push({from:'member',text:`Randevu değişikliği talebi: ${formatShort(e.date)} ${e.time}. Sebep: ${modal.querySelector('#rsReason').value||'Belirtilmedi'}`});save();closeModal();toast('Değişiklik talebi PT’ye gönderildi.')}else toast('Uygun slot bulunamadı.')}}
function messages(){view.innerHTML=`<div class="toolbar"><div><h1>Mesajlar</h1><div class="muted">Piti içinde yazış, fotoğraf ve video paylaş.</div></div></div><div class="card" style="max-width:850px"><div class="subTitle">${state.role==='pt'?state.customer.name:'Mehmet Kaya · PT'}</div><div class="chat" id="chatBox">${state.messages.map(m=>`<div class="msg ${m.from===state.role?'me':'them'}">${escapeHtml(m.text)}</div>`).join('')}</div><div class="composer"><input class="input" id="msgInput" placeholder="Mesaj yaz..."><button class="btn ghost" id="attachBtn">📎</button><button class="btn primary" id="sendMsg">Gönder</button></div></div>`;const cb=document.querySelector('#chatBox');cb.scrollTop=cb.scrollHeight;document.querySelector('#sendMsg').onclick=sendMessage;document.querySelector('#msgInput').onkeydown=e=>{if(e.key==='Enter')sendMessage()};document.querySelector('#attachBtn').onclick=()=>toast('Demo: foto/video yükleme butonu çalışıyor; dosya sunucuya gönderilmiyor.')}
function sendMessage(){const inp=document.querySelector('#msgInput');const t=inp.value.trim();if(!t)return;state.messages.push({from:state.role,text:t});save();messages()}
function progress(){view.innerHTML=`<div class="toolbar"><div><h1>Gelişim</h1><div class="muted">Kilo, ölçü ve ilerleme takibi.</div></div></div><div class="grid4">${kpi('Başlangıç Kilo','94,0 kg','1 Haziran')}${kpi('Güncel Kilo','89,4 kg','Bugün')}${kpi('Değişim','−4,6 kg','−4,9%')}${kpi('Tamamlanan Seans',state.package.usedSessions,'Aktif paket')}</div><div class="card" style="margin-top:18px"><h2 class="sectionTitle">Demo notu</h2><div class="notice">Bu sürümde gelişim verileri örnek veri olarak gösteriliyor. Sonraki iterasyonda ölçüm girişi ve grafik etkileşimi bağlanabilir.</div></div>`}
function openModal(html){modal.innerHTML=html;modalBack.classList.add('show');modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){modalBack.classList.remove('show')}modalBack.onclick=e=>{if(e.target===modalBack)closeModal()}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));document.querySelector('#resetBtn').onclick=()=>{localStorage.removeItem('pitiDemoV2');state=clone(seed);toast('Demo sıfırlandı.');render()};
render();
})();
</script>
</body>
</html>
